<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouroboros Hub - Get Key</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: #050508;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Dynamic Canvas Particle Background */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient Light Spheres */
        .glow-sphere-1 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(120, 119, 198, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 10%;
            left: 15%;
            z-index: 1;
            animation: floatGlow 10s infinite alternate ease-in-out;
        }

        .glow-sphere-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(0,0,0,0) 70%);
            bottom: 10%;
            right: 15%;
            z-index: 1;
            animation: floatGlow 12s infinite alternate-reverse ease-in-out;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* Card 3D Perspective Container */
        .card-container {
            perspective: 1000px;
            z-index: 10;
            width: 100%;
            max-width: 460px;
        }

        /* Glassmorphism Card */
        .card {
            background: rgba(18, 18, 24, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            position: relative;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            transform-style: preserve-3d;
            overflow: hidden;
        }

        /* Animated Border Highlight */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, rgba(255, 255, 255, 0.2));
            animation: rotateBorder 6s linear infinite;
            z-index: -1;
        }

        .card-inner {
            position: relative;
            z-index: 2;
        }

        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom "O" Logo with Rotating Ring */
        .logo-wrapper {
            position: relative;
            width: 76px;
            height: 76px;
            margin: 0 auto 24px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(255, 255, 255, 0.8);
            border-right-color: rgba(56, 189, 248, 0.5);
            animation: spinRing 4s linear infinite;
        }

        .logo-ring-outer {
            position: absolute;
            width: 118%;
            height: 118%;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            animation: spinRingReverse 12s linear infinite;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinRingReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        .logo-o {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            user-select: none;
        }

        h1 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: #80808e;
            font-size: 13px;
            margin-bottom: 28px;
            font-weight: 400;
        }

        /* Key Container Box */
        .key-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .key-box {
            background: rgba(10, 10, 14, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            word-break: break-all;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .key-box:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.1), inset 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .key-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13.5px;
            color: #38bdf8;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        /* Shimmer Copy Button */
        .btn-copy {
            position: relative;
            background: #ffffff;
            color: #09090b;
            border: none;
            padding: 15px 24px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
        }

        .btn-copy::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 50%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: rotate(30deg);
            transition: 0.6s;
        }

        .btn-copy:hover::after {
            left: 130%;
        }

        .btn-copy:hover {
            background: #f4f4f5;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.25);
        }

        .btn-copy:active {
            transform: translateY(0);
        }

        .btn-copy.copied {
            background: #22c55e;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4);
        }

        /* Floating Toast Message */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(20, 20, 26, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: #4ade80;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Dynamic Particle Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Background Ambient Glows -->
    <div class="glow-sphere-1"></div>
    <div class="glow-sphere-2"></div>

    <!-- 3D Card Container -->
    <div class="card-container" id="cardContainer">
        <div class="card" id="card">
            <div class="card-inner">
                <!-- Custom "O" Logo with Rotating Ring -->
                <div class="logo-wrapper">
                    <div class="logo-ring-outer"></div>
                    <div class="logo-ring"></div>
                    <div class="logo-o">O</div>
                </div>

                <h1>Ouroboros Hub</h1>
                <p class="subtitle">Click the button below to copy your authentication key</p>

                <div class="key-wrapper">
                    <div class="key-box">
                        <span class="key-text" id="keyValue">YadeaOuroborosHubKeyDuojeksHopjakwkej</span>
                    </div>
                </div>

                <button class="btn-copy" id="btnCopy" onclick="copyKey()">
                    <i class="fa-regular fa-copy" id="btnIcon"></i>
                    <span id="btnText">Copy Key</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span>Key copied to clipboard successfully!</span>
    </div>

    <script>
        // Copy Key Logic
        function copyKey() {
            const keyText = document.getElementById("keyValue").innerText;
            const toast = document.getElementById("toast");
            const btnCopy = document.getElementById("btnCopy");
            const btnText = document.getElementById("btnText");
            const btnIcon = document.getElementById("btnIcon");

            navigator.clipboard.writeText(keyText).then(() => {
                // Update Button State
                btnCopy.classList.add("copied");
                btnText.innerText = "Copied!";
                btnIcon.className = "fa-solid fa-check";

                // Show Toast Notification
                toast.classList.add("show");

                setTimeout(() => {
                    toast.classList.remove("show");
                    btnCopy.classList.remove("copied");
                    btnText.innerText = "Copy Key";
                    btnIcon.className = "fa-regular fa-copy";
                }, 2500);
            });
        }

        // 3D Card Tilt Effect
        const cardContainer = document.getElementById('cardContainer');
        const card = document.getElementById('card');

        cardContainer.addEventListener('mousemove', (e) => {
            const rect = cardContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = (y - centerY) / 15;
            const rotateY = (centerX - x) / 15;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        cardContainer.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0deg) rotateY(0deg)';
        });

        // Interactive Particle Canvas Background
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        const particleCount = 45;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();

                // Draw connecting lines between close particles
                for (let j = index + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.08 * (1 - dist / 120)})`;
                        ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>

</body>
</html>
